apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-core
spec:
  replicas: 2
  template:
    spec:
      containers:
      - name: api-core
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-core
spec:
  minReplicas: 2
  maxReplicas: 5

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-core
spec:
  minAvailable: 1
